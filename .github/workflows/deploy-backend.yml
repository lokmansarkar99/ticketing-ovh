name: Deploy Backend to EC2

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "ecosystem.config.cjs"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {}

concurrency:
  group: ticketing-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DATABASE_NAME,DATABASE_USER,DATABASE_PASSWORD
          script_stop: true
          command_timeout: 15m
          script: |
            set -eu

            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            fi

            cd /home/lokman/projects/ticketing-ovh

            echo "Fetching source..."
            git fetch origin main
            git reset --hard origin/main

            cd backend

            echo "Installing dependencies..."
            npm ci

            echo "Generating Prisma Client..."
            npx prisma generate --schema=prisma/schema.prisma

            echo "Checking migration history..."
            if ! mysql -h 127.0.0.1 -u "$DATABASE_USER" -p"$DATABASE_PASSWORD" -e "USE $DATABASE_NAME; SHOW TABLES LIKE '_prisma_migrations';" | grep -q '_prisma_migrations'; then
              echo "No migration history found. Baselining..."
              mkdir -p prisma/migrations/0_init
              npx prisma migrate diff --from-empty --to-schema prisma/schema.prisma --script > prisma/migrations/0_init/migration.sql
              npx prisma migrate resolve --applied 0_init
            fi

            echo "Applying production migrations..."
            npx prisma migrate deploy --schema=prisma/schema.prisma

            echo "Building backend..."
            NODE_OPTIONS="--max-old-space-size=2048" npm run build

            test -f dist/index.js

            cd /home/lokman/projects/ticketing-ovh

            echo "Reloading PM2..."
            pm2 startOrReload ecosystem.config.cjs --update-env
            pm2 save

            echo "Checking application status..."
            pm2 status